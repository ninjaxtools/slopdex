name: Publish npm with trusted publishing

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # Match cargo-dist's stable-release policy; never publish from PR runs.
    if: >-
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') &&
      (!fromJSON(inputs.plan).announcement_is_prerelease || fromJSON(inputs.plan).publish_prereleases)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: artifacts-build-global
          path: target/npm/
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      # OIDC publishing requires npm >=11.5.1. Use the current npm 11 release
      # rather than relying on the version bundled with the runner's Node.
      - name: Install OIDC-capable npm
        run: npm install --global npm@11
      - name: Verify npm publication metadata
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          const expected = JSON.parse(readFileSync('npm/package.json', 'utf8'));
          const actual = JSON.parse(execFileSync('tar', ['-xOf', 'target/npm/slopdex-npm-package.tar.gz', 'package/package.json'], { encoding: 'utf8' }));
          for (const key of ['name', 'version', 'description', 'license']) assert.equal(actual[key], expected[key], `npm ${key} mismatch`);
          const repository = value => (typeof value === 'string' ? value : value.url).replace(/^git\+/, '').replace(/\.git$/, '');
          assert.equal(repository(actual.repository), repository(expected.repository), 'npm repository mismatch');
          assert.equal(expected.publishConfig.access, 'public');
          assert.ok(actual.bin.slopdex, 'generated package must expose the native CLI');
          NODE
      - name: Publish cargo-dist's npm installer
        run: npm publish --access public ./target/npm/slopdex-npm-package.tar.gz
