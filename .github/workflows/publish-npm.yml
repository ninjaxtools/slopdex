name: Publish npm with trusted publishing

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # Match cargo-dist's stable-release policy; never publish from PR runs.
    if: >-
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') &&
      (!fromJSON(inputs.plan).announcement_is_prerelease || fromJSON(inputs.plan).publish_prereleases)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: artifacts-build-global
          path: npm/
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      # OIDC publishing requires npm >=11.5.1. Use the current npm 11 release
      # rather than relying on the version bundled with the runner's Node.
      - name: Install OIDC-capable npm
        run: npm install --global npm@11
      - name: Publish cargo-dist's npm installer
        run: npm publish --access public ./npm/slopdex-npm-package.tar.gz
