# GitHub Actions publishes binaries and npm; cargo-release only prepares and
# pushes the version commit/tag. --no-publish remains valid on the command line.
publish = false
consolidate-commits = false
pre-release-commit-message = "Release {{version}}"
tag-name = "v{{version}}"
tag-message = "Release {{version}}"
pre-release-hook = ["cargo", "release-check"]

# cargo-release updates Cargo.toml and Cargo.lock itself. Keep npm publication
# metadata synchronized with the native release version.
[[pre-release-replacements]]
file = "npm/package.json"
search = '(?m)^(  "version": ")[^"]+("[,]?)$'
replace = '${1}{{version}}${2}'
exactly = 1
prerelease = true
