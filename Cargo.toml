[package]
name = "slopdex"
version = "0.26.0"
edition = "2024"
license = "MIT"
description = "Semantic code and Markdown search with SQLite and USearch"
repository = "https://github.com/ninjaxtools/slopdex"

[workspace]
members = ["xtask"]
default-members = ["."]
resolver = "3"

[lib]
path = "src/lib.rs"

[[bin]]
name = "slopdex"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cliclack = "0.5.6"
dirs = "6"
fs2 = "0.4"
globset = "0.4"
ignore = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
rust-s3 = { version = "0.37.2", default-features = false, features = ["sync-rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
tree-sitter = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-c = "0.24"
usearch = "2.26.2"
zstd = { version = "0.14", default-features = false }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"

# Native archives and the npm installer are built by cargo-dist.
[profile.dist]
inherits = "release"
lto = "thin"
